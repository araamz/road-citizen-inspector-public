# Ext. Reverse Proxy
# (DYNAMIC - 3 servers] frontend_app = 3000
# (DYNAMIC - 3 servers) gateway_api = 4000
# (DYNAMIC - 3 servers) session_api = 4001
# (DYNAMIC - 3 servers) uplink_api = 4002
# (DYNAMIC - 3 servers) session_expiry_wrkr = [N/A]
# (DYNAMIC - 3 servers) uplink_processor_wrkr = [N/A]

# (STATIC - 1 server) session_db = 5432
# (STATIC - 1 server) uplink_db = 5432
# (STATIC - 1 server) app_queue = 5672
# (STATIC - 1 server) app_redis = 6379

# Server Port Ranges (external reverse proxy)
# (DYNAMIC - 3 servers] frontend_app = 3000 -- "/*"
# (DYNAMIC - 3 servers) uplink_api = 4200 -- /uplink/:appId/up/:devId
# (DYNAMIC - 3 servers) ext_proxy_api = 4000 -- /api/*

services:
  frontend_app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./apps/rci_frontend/dockerfile
    ports:
      - 3000
    deploy:
      replicas: 3
  session_api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./services/session/api/dockerfile
    ports:
      - 4001
    environment:
      - POSTGRES_DB=rci_session_database
      - POSTGRES_HOST=session_db
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_PORT=5432
      - RCI_GATEWAY_API_ADDR=http://gateway_api:4000
      - RCI_SESSION_API_ADDR=http://session_api:4001
      - RCI_UPLINK_API_ADDR=http://uplink_api:4002
      - APP_RABBITMQ_ADDR=amqp://rci:cyrus@app_rabbitmq:5672
      - APP_EXT_NGINX_ADDR=http://app_ext_nginx:443
      - APP_REDIS_ADDR=redis://app_redis:6379
    depends_on:
      session_db:
        condition: service_started
      app_rabbitmq:
        condition: service_healthy
        restart: true
      app_redis:
        condition: service_healthy
        restart: true
    deploy:
      replicas: 3
  session_db:
    restart: unless-stopped
    image: public.ecr.aws/docker/library/postgres:17.6
    container_name: rci_session_db
    volumes:
      - ./services/session/db/data:/var/lib/postgresql/data
      - ./services/session/db/scripts:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=rci_session_database
    ports:
      - 6778:5432
  session_expiry_wrkr:
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./services/session/session_expiry_wrkr/dockerfile
    depends_on:
      session_db:
        condition: service_started
      app_rabbitmq:
        condition: service_healthy
        restart: true
    environment:
      - POSTGRES_DB=rci_session_database
      - POSTGRES_HOST=session_db
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_PORT=5432
      - RCI_GATEWAY_API_ADDR=http://gateway_api:4000
      - RCI_SESSION_API_ADDR=http://session_api:4001
      - RCI_UPLINK_API_ADDR=http://uplink_api:4002
      - APP_RABBITMQ_ADDR=amqp://rci:cyrus@app_rabbitmq:5672
      - APP_EXT_NGINX_ADDR=http://app_ext_nginx:443
      - APP_REDIS_ADDR=redis://app_redis:6379
    deploy:
      replicas: 3
  uplink_api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./services/uplink/api/dockerfile
    ports:
      - 4002
    depends_on:
      uplink_db:
        condition: service_started
      app_rabbitmq:
        condition: service_healthy
        restart: true
    environment:
      - POSTGRES_DB=rci_uplink_database
      - POSTGRES_HOST=uplink_db
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_PORT=5432
      - RCI_GATEWAY_API_ADDR=http://gateway_api:4000
      - RCI_SESSION_API_ADDR=http://session_api:4001
      - RCI_UPLINK_API_ADDR=http://uplink_api:4002
      - APP_RABBITMQ_ADDR=amqp://rci:cyrus@app_rabbitmq:5672
      - APP_EXT_NGINX_ADDR=http://app_ext_nginx:443
      - APP_REDIS_ADDR=redis://app_redis:6379
    deploy:
      replicas: 3
  uplink_db:
    restart: unless-stopped
    image: public.ecr.aws/docker/library/postgres:17.6
    container_name: rci_uplink_db
    volumes:
      - ./services/uplink/db/data:/var/lib/postgresql/data
      - ./services/uplink/db/scripts:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=rci_uplink_database
    ports:
      - 6779:5432
  uplink_processor_wrkr:
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./services/uplink/uplink_processor_wrkr/dockerfile
    depends_on:
      uplink_api:
        condition: service_started
      uplink_db:
        condition: service_started
      app_rabbitmq:
        condition: service_healthy
        restart: true
    environment:
      - RCI_GATEWAY_API_ADDR=http://gateway_api:4000
      - RCI_SESSION_API_ADDR=http://session_api:4001
      - RCI_UPLINK_API_ADDR=http://uplink_api:4002
      - APP_RABBITMQ_ADDR=amqp://rci:cyrus@app_rabbitmq:5672
      - APP_EXT_NGINX_ADDR=http://app_ext_nginx:443
      - APP_REDIS_ADDR=redis://app_redis:6379
    deploy:
      replicas: 3
  app_rabbitmq:
    restart: unless-stopped
    container_name: rci_app_rabbitmq
    build:
      context: .
      dockerfile: rabbitmq.dockerfile
    environment:
      - RCI_GATEWAY_API_ADDR=http://gateway_api:4000
      - RCI_SESSION_API_ADDR=http://session_api:4001
      - RCI_UPLINK_API_ADDR=http://uplink_api:4002
      - APP_RABBITMQ_ADDR=amqp://rci:cyrus@app_rabbitmq:5672
      - APP_EXT_NGINX_ADDR=http://app_ext_nginx:443
      - APP_REDIS_ADDR=redis://app_redis:6379
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5
    ports:
      - 5672
  app_redis:
    restart: unless-stopped
    container_name: rci_app_redis
    image: redis:8.0.4-alpine3.21
    ports:
      - 6379
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
  gateway_api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./services/gateway/dockerfile
    ports:
      - 4000
    environment:
      - RCI_GATEWAY_API_ADDR=http://gateway_api:4000
      - RCI_SESSION_API_ADDR=http://session_api:4001
      - RCI_UPLINK_API_ADDR=http://uplink_api:4002
      - APP_RABBITMQ_ADDR=amqp://rci:cyrus@app_rabbitmq:5672
      - APP_EXT_NGINX_ADDR=http://app_ext_nginx:443
      - APP_REDIS_ADDR=redis://app_redis:6379
    depends_on:
      app_redis:
        condition: service_healthy
      session_db:
        condition: service_started
      uplink_db:
        condition: service_started
      app_rabbitmq:
        condition: service_healthy
      uplink_api:
        condition: service_started
      session_api:
        condition: service_started
    deploy:
      replicas: 3
  app_ext_nginx:
    restart: unless-stopped
    container_name: rci_ext_nginx
    secrets:
      - tls_bundle
      - tls_key
    ports:
      - "4431:443"
      - "8081:80"
    image: nginx:trixie
    volumes:
      - ./nginx/production.nginx.conf:/etc/nginx/nginx.conf
      - ./static:/usr/src/app/public
    depends_on:
      app_redis:
        condition: service_healthy
      session_db:
        condition: service_started
      uplink_db:
        condition: service_started
      app_rabbitmq:
        condition: service_healthy
      uplink_api:
        condition: service_started
      session_api:
        condition: service_started
      gateway_api:
        condition: service_started
      frontend_app:
        condition: service_started
  us_uplink_api:
    restart: unless-stopped
    container_name: us_rci_uplink_api
    build:
      context: .
      dockerfile: ./services/uplink/api/dockerfile
    ports:
      - 6777:4002
    depends_on:
      uplink_db:
        condition: service_started
      app_rabbitmq:
        condition: service_healthy
        restart: true
    environment:
      - POSTGRES_DB=rci_uplink_database
      - POSTGRES_HOST=uplink_db
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_PORT=5432
      - RCI_GATEWAY_API_ADDR=http://gateway_api:4000
      - RCI_SESSION_API_ADDR=http://session_api:4001
      - RCI_UPLINK_API_ADDR=http://uplink_api:4002
      - APP_RABBITMQ_ADDR=amqp://rci:cyrus@app_rabbitmq:5672
      - APP_EXT_NGINX_ADDR=http://app_ext_nginx:443
      - APP_REDIS_ADDR=redis://app_redis:6379
  us_session_api:
    restart: unless-stopped
    container_name: us_rci_session_api
    build:
      context: .
      dockerfile: ./services/session/api/dockerfile
    ports:
      - 6776:4001
    environment:
      - POSTGRES_DB=rci_session_database
      - POSTGRES_HOST=session_db
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_PORT=5432
      - RCI_GATEWAY_API_ADDR=http://gateway_api:4000
      - RCI_SESSION_API_ADDR=http://session_api:4001
      - RCI_UPLINK_API_ADDR=http://uplink_api:4002
      - APP_RABBITMQ_ADDR=amqp://rci:cyrus@app_rabbitmq:5672
      - APP_EXT_NGINX_ADDR=http://app_ext_nginx:443
      - APP_REDIS_ADDR=redis://app_redis:6379
    depends_on:
      session_db:
        condition: service_started
      app_rabbitmq:
        condition: service_healthy
        restart: true
      app_redis:
        condition: service_healthy
        restart: true
secrets:
  tls_bundle:
    file: ${CERTS_FOLDER}/_.sample.com/_.sample.com.bundle.pem
  tls_key:
    file: ${CERTS_FOLDER}/_.sample.com/_.sample.com.key.pem
