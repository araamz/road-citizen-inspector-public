# Identity Server configuration
# Email configuration for "ttn.azaremehrjardi.dev"
is:
  # email:
  #   sender-name: "The Things Stack"
  #   sender-address: "noreply@ttn.azaremehrjardi.dev"
  #   network:
  #     name: "The Things Stack"
  #     console-url: "https://ttn.azaremehrjardi.dev/console"
  #     identity-server-url: "https://ttn.azaremehrjardi.dev/oauth"

    # If sending email with Sendgrid
    # provider: sendgrid
    # sendgrid:
    #   api-key: '...'              # enter Sendgrid API key

    # If sending email with SMTP
    # provider: smtp
    # smtp:
    #   address:  '...'             # enter SMTP server address
    #   username: '...'             # enter SMTP server username
    #   password: '...'             # enter SMTP server password

  # Web UI configuration for "ttn.azaremehrjardi.dev":
  oauth:
    ui:
      canonical-url: "https://ttn.azaremehrjardi.dev/oauth"
      is:
        base-url: "https://ttn.azaremehrjardi.dev/api/v3"

# HTTP server configuration
http:
  cookie:
    block-key: "" # generate 32 bytes (openssl rand -hex 32)
    hash-key: "" # generate 64 bytes (openssl rand -hex 64)
  metrics:
    password: "metrics" # choose a password
  pprof:
    password: "pprof" # choose a password

# If using custom certificates:
tls:
  source: file
  root-ca: /run/secrets/ca.pem
  certificate: /run/secrets/cert.pem
  key: /run/secrets/key.pem

# Let's encrypt for "ttn.azaremehrjardi.dev"
# tls:
#   source: acme
#   acme:
#     dir: /var/lib/acme
#     email: "you@ttn.azaremehrjardi.dev"
#     hosts: ["ttn.azaremehrjardi.dev"]
#     default-host: "ttn.azaremehrjardi.dev"

# If Gateway Server enabled, defaults for "ttn.azaremehrjardi.dev":
gs:
  mqtt:
    public-address: "ttn.azaremehrjardi.dev:1882"
    public-tls-address: "ttn.azaremehrjardi.dev:8882"
  mqtt-v2:
    public-address: "ttn.azaremehrjardi.dev:1881"
    public-tls-address: "ttn.azaremehrjardi.dev:8881"

# If Gateway Configuration Server enabled, defaults for "ttn.azaremehrjardi.dev":
gcs:
  basic-station:
    default:
      lns-uri: "wss://ttn.azaremehrjardi.dev:8887"

# Web UI configuration for "ttn.azaremehrjardi.dev":
console:
  ui:
    canonical-url: "https://ttn.azaremehrjardi.dev/console"
    account-url: "https://ttn.azaremehrjardi.dev/oauth"
    is:
      base-url: "https://ttn.azaremehrjardi.dev/api/v3"
    gs:
      base-url: "https://ttn.azaremehrjardi.dev/api/v3"
    ns:
      base-url: "https://ttn.azaremehrjardi.dev/api/v3"
    as:
      base-url: "https://ttn.azaremehrjardi.dev/api/v3"
    js:
      base-url: "https://ttn.azaremehrjardi.dev/api/v3"
    gcs:
      base-url: "https://ttn.azaremehrjardi.dev/api/v3"
    qrg:
      base-url: "https://ttn.azaremehrjardi.dev/api/v3"
    edtc:
      base-url: "https://ttn.azaremehrjardi.dev/api/v3"
    dcs:
      base-url: "https://ttn.azaremehrjardi.dev/api/v3"
  oauth:
    authorize-url: "https://ttn.azaremehrjardi.dev/oauth/authorize"
    token-url: "https://ttn.azaremehrjardi.dev/oauth/token"
    logout-url: "https://ttn.azaremehrjardi.dev/oauth/logout"
    client-id: "console"
    client-secret: "console" # choose or generate a secret

# If Application Server enabled, defaults for "ttn.azaremehrjardi.dev":
as:
  mqtt:
    public-address: "ttn.azaremehrjardi.dev:1883"
    public-tls-address: "ttn.azaremehrjardi.dev:8883"
  webhooks:
    downlink:
      public-address: "ttn.azaremehrjardi.dev:1885/api/v3"
    templates:
      directory: "/lorawan-webhook-templates"

# Managed gateway configuration, defaults for "ttn.azaremehrjardi.dev".
# This configures a connection with The Things Gateway Controller, a service operated by The Things Industries.
# This allows connecting, for example, The Things Indoor Gateway Pro.
ttgc:
  enabled: true
  domain: ttn.azaremehrjardi.dev
  # Let's Encrypt:
  # tls:
  #   source: acme
  # If using custom certificates:
  tls:
    source: file
    certificate: /run/secrets/cert.pem
    key: /run/secrets/key.pem

